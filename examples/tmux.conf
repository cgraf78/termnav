# Minimal Termnav integration for tmux.
#
# These options carry focus, mouse, passthrough, and hyperlink state across the
# terminal stack. Merge them into a larger tmux config rather than treating
# this example as a complete opinionated tmux setup.
set -g mouse on
set -g focus-events on
set -g allow-passthrough on
set -as terminal-features ',*:hyperlinks'

# Publish focus ownership only while this exact client is focused. A direct
# terminal client has no parent route and leaves no resident worker; each
# nested layer claims only the pane immediately outside it. Focus-out hooks dim
# the local leaf and provide prompt parent cleanup; leases cover crashes or lost
# SSH without putting a subprocess in the redraw path.
termnav_focus_watch="run-shell -b 'command -v termnav-tmux-focus >/dev/null 2>&1 && exec termnav-tmux-focus watch --tmux-socket #{q:socket_path} --client-pid #{client_pid} --client-tty #{q:client_tty}'"
termnav_focus_stop="run-shell -b 'command -v termnav-tmux-focus >/dev/null 2>&1 && exec termnav-tmux-focus stop --tmux-socket #{q:socket_path} --client-pid #{client_pid} --client-tty #{q:client_tty}'"
termnav_focus_sync="run-shell -b 'command -v termnav-tmux-focus >/dev/null 2>&1 && exec termnav-tmux-focus sync --tmux-socket #{q:socket_path} --client-pid #{client_pid} --client-tty #{q:client_tty}'"
# Control-mode clients are automation transports rather than interactive
# terminal views. They must not publish or revoke visual focus ownership.
set-hook -g client-attached[110] {
  if-shell -F '#{==:#{client_control_mode},0}' "$termnav_focus_watch"
}
set-hook -g client-focus-in[110] {
  if-shell -F '#{==:#{client_control_mode},0}' "$termnav_focus_watch"
}
set-hook -g client-focus-out[110] {
  if-shell -F '#{==:#{client_control_mode},0}' "$termnav_focus_stop"
}
set-hook -g client-detached[110] {
  if-shell -F '#{==:#{client_control_mode},0}' "$termnav_focus_stop"
}
# Pane-local dim overrides normally clear on focus-in. These hooks cover the
# rarer case where another attached client changes the active pane while this
# client is unfocused. Their option guard keeps ordinary navigation process-free.
set-hook -g after-select-pane[110] {
  if-shell -F '#{&&:#{==:#{client_control_mode},0},#{!=:#{@termnav_client_unfocused},}}' "$termnav_focus_sync"
}
set-hook -g after-select-window[110] {
  if-shell -F '#{&&:#{==:#{client_control_mode},0},#{!=:#{@termnav_client_unfocused},}}' "$termnav_focus_sync"
}
set-hook -g client-session-changed[110] {
  if-shell -F '#{&&:#{==:#{client_control_mode},0},#{!=:#{@termnav_client_unfocused},}}' "$termnav_focus_sync"
}

# Consumers can use this shared predicate in pane-active-border-style and
# pane-border-format. It is deliberately a pure format so redraws never fork a
# process or touch the filesystem.
set -g @termnav_pane_is_focused_leaf '#{&&:#{pane_active},#{&&:#{m:*focused*,#{client_flags}},#{==:#{@termnav_child_focus},}}}'

# tmux compiles pane content styles without client context. Keep the normal
# active style literal, and publish the style a pane should use while it is an
# unfocused leaf or a focused child's container. Termnav installs this as a
# pane-local override and restores the pane's previous override afterward.
set -g window-style 'bg=default'
set -g @termnav_inactive_style 'bg=default'
set -g window-active-style 'bg=colour234'

# A tmux layer with multiple windows owns Ctrl-Tab. A one-window layer passes
# the exact triggering client identity to Termnav, which can continue outward
# through a parent tmux, WezTerm, or a supported integrated terminal. Boundary
# routing stays foregrounded so tmux preserves this client's key order.
# tmux session IDs begin with `$`; `q:` must escape that dollar before
# `run-shell` evaluates the assembled command through the user's shell.
navigate_parent_args="--parent --client-pid #{client_pid} --client-tty #{q:client_tty} --client-created #{client_created} --client-termtype #{q:client_termtype} --source-socket #{q:socket_path} --source-pane #{pane_id} --source-session #{q:session_id}"
bind-key -n C-Tab if-shell -F '#{>:#{session_windows},1}' \
  'next-window' \
  "run-shell 'termnav-relay navigate tab-select next $navigate_parent_args'"
bind-key -n C-BTab if-shell -F '#{>:#{session_windows},1}' \
  'previous-window' \
  "run-shell 'termnav-relay navigate tab-select previous $navigate_parent_args'"

# Preserve native mouse ownership. Neovim and nested tmux instances receive the
# original event; only a bare terminal pane asks Termnav to classify the token.
# A quoted here-document keeps terminal text as data even when it contains
# whitespace, quotes, dollar signs, or shell-looking fragments.
bind-key -n C-MouseDown1Pane if-shell -F '#{mouse_any_flag}' \
  'send-keys -M' 'select-pane -t ='
bind-key -n C-MouseDrag1Pane if-shell -F '#{mouse_any_flag}' \
  'send-keys -M' 'display-message -p ""'
bind-key -n C-MouseUp1Pane if-shell -F '#{mouse_any_flag}' \
  'send-keys -M' \
  'run-shell -b "tmux-follow-click --stdin <<\"__TERMNAV_CLICK__\"
#{mouse_hyperlink}
#{mouse_word}
#{mouse_line}
#{mouse_x}
#{pane_current_path}
#{client_tty}
#{pane_id}
#{mouse_y}
#{pane_top}
#{pane_left}
__TERMNAV_CLICK__"'
