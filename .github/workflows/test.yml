name: Tests

on:
  push:
    # main is the only maintained branch. Keep this trigger aligned with the
    # protected default branch so retired aliases cannot hide CI drift.
    branches: [main]
  pull_request:
  schedule:
    # Stagger sibling repositories so scheduled full matrices do not compete
    # for the same runner capacity at the top of the hour.
    - cron: "57 8 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  shell:
    uses: cgraf78/actions/.github/workflows/shell-ci.yml@9b9c023fbe5f47be5f70f5a82bd8e2f298f6a1b1
    with:
      matrix-set: full
      profiles: base,zsh,lua,neovim,tmux,python,openssh-netcat-lsof
      # wezterm-test falls back to `nvim -l`, so Termux does not need a second
      # standalone Lua runtime. Avoid the current lua54/lua51 collision over
      # the generic lua++.pc package metadata file.
      termux-profiles: base,zsh,neovim,tmux,python,openssh-netcat-lsof
      shellcheck-inventory-path: .github/shellcheck-files.txt
      test-command: TERMNAV_SKIP_SHELLCHECK=1 test/termnav-test

  actions-sync:
    name: cgraf78/actions sync
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # GitHub resolves literal `uses:` refs before a job can read repository
      # files, so `.github/cgraf78-actions.lock` cannot be interpolated. This gate
      # verifies every unavoidable cgraf78/actions literal still matches that
      # single reviewed dependency decision.
      - uses: cgraf78/actions/.github/actions/verify-consumer-sync@9b9c023fbe5f47be5f70f5a82bd8e2f298f6a1b1

  relay-performance:
    name: Relay startup / Ubuntu
    if: ${{ github.event_name == 'pull_request' }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Compare relay hot paths with the PR base
        env:
          TERMNAV_PERFORMANCE_BASELINE: ${{ github.event.pull_request.base.sha }}
        run: test/suites/relay-performance-test

  eza-current:
    name: Current eza compatibility / Arch
    runs-on: ubuntu-latest
    container: archlinux:latest
    steps:
      - name: Install test dependencies
        run: |
          pacman-key --init
          pacman-key --populate
          pacman -Syu --noconfirm bash eza git lua python zsh

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Exercise current eza CLI
        shell: bash
        run: test/suites/wezterm-test

  required:
    name: Required
    if: ${{ always() }}
    needs: [shell, eza-current, relay-performance]
    runs-on: ubuntu-24.04
    env:
      SHELL_RESULT: ${{ needs.shell.result }}
      EZA_CURRENT_RESULT: ${{ needs.eza-current.result }}
      RELAY_PERFORMANCE_RESULT: ${{ needs.relay-performance.result }}
    steps:
      - name: Require all Termnav compatibility checks
        shell: bash
        run: |-
          printf 'Shell CI: %s\n' "$SHELL_RESULT"
          printf 'Current eza: %s\n' "$EZA_CURRENT_RESULT"
          printf 'Relay performance: %s\n' "$RELAY_PERFORMANCE_RESULT"

          test "$SHELL_RESULT" = success
          test "$EZA_CURRENT_RESULT" = success
          case "$RELAY_PERFORMANCE_RESULT" in
            success | skipped) ;;
            *) exit 1 ;;
          esac
