name: Tests

on:
  push:
    branches: [master, main]
  pull_request:
  schedule:
    - cron: "0 7 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  shell:
    uses: cgraf78/actions/.github/workflows/shell-ci.yml@e3246b432e347b5c331940d41626cc7bda60b803
    with:
      matrix-set: full
      profiles: base,shellcheck,lua,neovim,tmux,python,openssh-netcat-lsof
      test-command: test/termnav-test

  eza-current:
    name: Current eza compatibility / Arch
    runs-on: ubuntu-latest
    container: archlinux:latest
    steps:
      - name: Install test dependencies
        run: |
          pacman-key --init
          pacman-key --populate
          pacman -Syu --noconfirm bash eza git lua python

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Exercise current eza CLI
        shell: bash
        run: test/suites/wezterm-test
