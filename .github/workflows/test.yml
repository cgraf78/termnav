name: Tests

on:
  push:
    # main is the only maintained branch. Keep this trigger aligned with the
    # protected default branch so retired aliases cannot hide CI drift.
    branches: [main]
  pull_request:
  schedule:
    # Stagger sibling repositories so scheduled full matrices do not compete
    # for the same runner capacity at the top of the hour.
    - cron: "57 8 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  rust:
    uses: cgraf78/actions/.github/workflows/rust-ci.yml@2001f9830b4d5fa6fbc67d3445e2328022c97cac
    with:
      matrix-set: full
      msrv-toolchain: "1.88"
      profiles: base,shellcheck,zsh,lua,neovim,tmux-pinned,python,openssh-netcat-lsof
      # Exercise relative fixture entry points with a caller's CDPATH set.
      test-command: export TERMNAV_REQUIRE_TMUX=1 && cargo test --locked && CDPATH=. test/termnav-test
      termux-profiles: base,zsh,neovim,tmux,python,openssh-netcat-lsof
      termux-command: TERMNAV_REQUIRE_TMUX=1 TERMNAV_TEST_BINARY=./termnav TERMNAV_SKIP_SHELLCHECK=1 test/termnav-test
      termux-host-command: |
        archive=$(
          CARGO_TARGET_DIR="$RUNNER_TEMP/termnav-termux-target" \
            scripts/package-release.sh "$RUST_TARGET" "$ASSET_PLATFORM"
        )
        scripts/smoke-release.sh "$ASSET_PLATFORM"
        mkdir -p .termux-ci
        tar -xzf "$archive" -C .termux-ci ./bin/termnav
        cp .termux-ci/bin/termnav ./termnav
      android-package-smoke-command: |
        scripts/package-release.sh "$RUST_TARGET" "$ASSET_PLATFORM"
        scripts/smoke-release.sh "$ASSET_PLATFORM"
      package-smoke-musl-target: x86_64-unknown-linux-musl
      package-smoke-command: |
        scripts/package-release.sh "$RUST_TARGET" linux-x86_64-musl
        scripts/smoke-release.sh linux-x86_64-musl

  tmux-floor:
    name: tmux compatibility floor / Ubuntu
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Rust
        uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable
        with:
          toolchain: stable
      - name: Install the exact tmux floor
        uses: cgraf78/actions/.github/actions/shell-ci-prereqs@2001f9830b4d5fa6fbc67d3445e2328022c97cac
        with:
          matrix-name: Ubuntu
          profiles: python,tmux-floor-exact
      - name: Exercise navigation and focus at the supported floor
        env:
          TERMNAV_REQUIRE_TMUX: "1"
          TERMNAV_SKIP_SHELLCHECK: "1"
        run: test/termnav-test --tmux-floor-smoke

  actions-sync:
    name: cgraf78/actions sync
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        # Name checkout's throwaway initial branch so Git skips its hint.
        env:
          GIT_CONFIG_COUNT: "1"
          GIT_CONFIG_KEY_0: init.defaultBranch
          GIT_CONFIG_VALUE_0: main
        with:
          persist-credentials: false

      # GitHub resolves literal `uses:` refs before a job can read repository
      # files, so `.github/cgraf78-actions.lock` cannot be interpolated. This gate
      # verifies every unavoidable cgraf78/actions literal still matches that
      # single reviewed dependency decision.
      - uses: cgraf78/actions/.github/actions/verify-consumer-sync@2001f9830b4d5fa6fbc67d3445e2328022c97cac

  vscode-adapter:
    name: VS Code adapter / Ubuntu
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        # Name checkout's throwaway initial branch so Git skips its hint.
        env:
          GIT_CONFIG_COUNT: "1"
          GIT_CONFIG_KEY_0: init.defaultBranch
          GIT_CONFIG_VALUE_0: main
        with:
          persist-credentials: false

      # The broad shell matrix may omit Node in minimal containers. This
      # required host job makes the shipped extension's runtime behavior a hard
      # contract instead of accepting its documented optional skip.
      - name: Exercise the production VS Code adapter
        run: |
          node --version
          test/suites/vscode-adapter-test

  relay-performance:
    name: Relay hot path / Ubuntu
    if: ${{ github.event_name == 'pull_request' }}
    runs-on: ubuntu-24.04
    # The harness has bounded protocol waits, but it deliberately executes both
    # the PR and its base revision. A historical binary deadlock must not retain
    # a hosted runner until GitHub's much larger platform default expires.
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        # Name checkout's throwaway initial branch so Git skips its hint.
        env:
          GIT_CONFIG_COUNT: "1"
          GIT_CONFIG_KEY_0: init.defaultBranch
          GIT_CONFIG_VALUE_0: main
        with:
          fetch-depth: 0
          persist-credentials: false

      # This is a standalone benchmark job, not a child of the reusable Rust
      # matrix above, so it must establish its own toolchain before the harness
      # builds both the base revision and the pull-request candidate.
      - name: Install Rust
        uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable
        with:
          toolchain: stable

      - name: Install pinned tmux
        uses: cgraf78/actions/.github/actions/shell-ci-prereqs@2001f9830b4d5fa6fbc67d3445e2328022c97cac
        with:
          matrix-name: Ubuntu
          profiles: tmux-pinned

      - name: Compare relay hot paths with the PR base
        env:
          TERMNAV_PERFORMANCE_BASELINE: ${{ github.event.pull_request.base.sha }}
        run: test/suites/relay-performance-test

      - name: Exercise the post-cutover baseline path
        env:
          TERMNAV_PERFORMANCE_BASELINE: HEAD
          TERMNAV_PERFORMANCE_SAMPLES: "2"
          TERMNAV_TEST_BINARY: ./target/relay performance candidate
        # Leave no binary at the default path so the smoke run also verifies
        # that the Python measurements use the shell suite's selected candidate.
        run: |
          mv target/release/termnav "$TERMNAV_TEST_BINARY"
          test/suites/relay-performance-test

  relay-performance-macos:
    name: Relay hot path / macOS
    if: ${{ github.event_name == 'pull_request' }}
    runs-on: macos-latest
    # Keep the same outer failure contract on the slower procfs-free path.
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        # Name checkout's throwaway initial branch so Git skips its hint.
        env:
          GIT_CONFIG_COUNT: "1"
          GIT_CONFIG_KEY_0: init.defaultBranch
          GIT_CONFIG_VALUE_0: main
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Install Rust
        uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable
        with:
          toolchain: stable

      - name: Install pinned tmux
        uses: cgraf78/actions/.github/actions/shell-ci-prereqs@2001f9830b4d5fa6fbc67d3445e2328022c97cac
        with:
          matrix-name: macOS
          profiles: tmux-pinned

      # macOS has no procfs. This repeats the real nested-boundary benchmark on
      # the fallback process-inspection path so a change cannot be fast on
      # Linux while spawning enough `ps` processes to feel sluggish on Macs.
      # Use the shared sample count so two occasional scheduling stalls
      # cannot trip the absolute p95 ceiling on their own.
      - name: Compare relay hot paths with the PR base
        env:
          TERMNAV_PERFORMANCE_BASELINE: ${{ github.event.pull_request.base.sha }}
        run: test/suites/relay-performance-test

  eza-current:
    name: Current eza compatibility / Arch
    runs-on: ubuntu-latest
    # The job intentionally tracks Arch's rolling userland to catch current eza
    # compatibility. A digest would turn that policy into a stale snapshot.
    container: archlinux:latest # zizmor: ignore[unpinned-images]
    steps:
      - name: Install test dependencies
        run: |
          pacman-key --init
          pacman-key --populate
          # Name only missing targets: pacman warns "up to date --
          # reinstalling" for each one already installed, and the image
          # ships bash. `-T` lists the unsatisfied targets and exits 127;
          # any other failure falls back to the full list so errors surface.
          targets="bash eza git lua python rust zsh"
          status=0
          # shellcheck disable=SC2086 # Split into one package per word.
          missing=$(pacman -T $targets) || status=$?
          if [ "$status" -ne 0 ] && [ "$status" -ne 127 ]; then
            missing=$targets
          fi
          # `-u` still upgrades everything installed, as before.
          # shellcheck disable=SC2086 # Split into one package per word.
          pacman -Syu --noconfirm --needed $missing

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        # Name checkout's throwaway initial branch so Git skips its hint.
        env:
          GIT_CONFIG_COUNT: "1"
          GIT_CONFIG_KEY_0: init.defaultBranch
          GIT_CONFIG_VALUE_0: main
        with:
          persist-credentials: false

      - name: Exercise current eza CLI
        shell: bash
        run: |
          cargo build --release --locked
          test/suites/wezterm-integration-test

  image-paste:
    name: Image paste end to end / ${{ matrix.name }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Ubuntu
            runner: ubuntu-24.04
            target: x86_64-unknown-linux-musl
            platform: linux-x86_64-musl
          - name: macOS
            runner: macos-26
            target: aarch64-apple-darwin
            platform: macos-arm64
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Rust
        uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable
        with:
          toolchain: stable
          targets: ${{ matrix.target }}
      - name: Install pinned tmux and WezTerm
        uses: cgraf78/actions/.github/actions/shell-ci-prereqs@2001f9830b4d5fa6fbc67d3445e2328022c97cac
        with:
          matrix-name: ${{ matrix.name }}
          profiles: tmux-pinned,wezterm-pinned
      - name: Install Linux image paste prerequisites
        if: ${{ runner.os == 'Linux' }}
        shell: bash
        run: |
          # WezTerm loads EGL dynamically, even with software rendering.
          sudo apt-get install -y --no-install-recommends \
            fonts-dejavu-core libegl1 libegl-mesa0 libgl1 libgl1-mesa-dri \
            musl-tools openssh-server x11-apps xclip xdotool xvfb zsh
      - name: Install macOS image paste prerequisites
        if: ${{ runner.os == 'macOS' }}
        shell: bash
        run: |
          # Apple's sshd rejects audit sessions for stdio proxy connections.
          brew install openssh
          printf 'TERMNAV_TEST_SSHD=%s/sbin/sshd\n' "$(brew --prefix openssh)" >> "$GITHUB_ENV"
      - name: Exercise both previews with the packaged Termnav
        shell: bash
        env:
          RUST_TARGET: ${{ matrix.target }}
          ASSET_PLATFORM: ${{ matrix.platform }}
        run: |
          test -n "$CI_WEZTERM_PINNED_RELEASE"
          test "$("$CI_WEZTERM_PINNED_BIN" --version)" = "wezterm $CI_WEZTERM_PINNED_VERSION"
          test -x "$CI_WEZTERM_PINNED_GUI"
          archive=$(scripts/package-release.sh "$RUST_TARGET" "$ASSET_PLATFORM")
          package="$RUNNER_TEMP/termnav-package"
          mkdir "$package"
          tar -xzf "$archive" -C "$package"
          python3 test/paste-image.py "$package/bin/termnav" --preview "$package"
          python3 test/paste-image-gui.py "$package/bin/termnav" "$package"

  required:
    name: Required
    if: ${{ always() }}
    needs: [rust, tmux-floor, vscode-adapter, eza-current, image-paste, relay-performance, relay-performance-macos]
    runs-on: ubuntu-24.04
    env:
      RUST_RESULT: ${{ needs.rust.result }}
      TMUX_FLOOR_RESULT: ${{ needs.tmux-floor.result }}
      VSCODE_ADAPTER_RESULT: ${{ needs.vscode-adapter.result }}
      EZA_CURRENT_RESULT: ${{ needs.eza-current.result }}
      IMAGE_PASTE_RESULT: ${{ needs.image-paste.result }}
      RELAY_PERFORMANCE_RESULT: ${{ needs.relay-performance.result }}
      RELAY_PERFORMANCE_MACOS_RESULT: ${{ needs.relay-performance-macos.result }}
    steps:
      - name: Require all Termnav compatibility checks
        shell: bash
        run: |-
          printf 'Rust CI: %s\n' "$RUST_RESULT"
          printf 'tmux compatibility floor: %s\n' "$TMUX_FLOOR_RESULT"
          printf 'VS Code adapter: %s\n' "$VSCODE_ADAPTER_RESULT"
          printf 'Current eza: %s\n' "$EZA_CURRENT_RESULT"
          printf 'Image paste end to end: %s\n' "$IMAGE_PASTE_RESULT"
          printf 'Relay performance: %s\n' "$RELAY_PERFORMANCE_RESULT"
          printf 'Relay performance macOS: %s\n' "$RELAY_PERFORMANCE_MACOS_RESULT"

          test "$RUST_RESULT" = success
          test "$TMUX_FLOOR_RESULT" = success
          test "$VSCODE_ADAPTER_RESULT" = success
          test "$EZA_CURRENT_RESULT" = success
          test "$IMAGE_PASTE_RESULT" = success
          case "$RELAY_PERFORMANCE_RESULT" in
            success | skipped) ;;
            *) exit 1 ;;
          esac
          case "$RELAY_PERFORMANCE_MACOS_RESULT" in
            success | skipped) ;;
            *) exit 1 ;;
          esac
