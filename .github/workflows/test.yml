name: Tests

on:
  push:
    # main is the only maintained branch. Keep this trigger aligned with the
    # protected default branch so retired aliases cannot hide CI drift.
    branches: [main]
  pull_request:
  schedule:
    # Stagger sibling repositories so scheduled full matrices do not compete
    # for the same runner capacity at the top of the hour.
    - cron: "57 8 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  rust:
    uses: cgraf78/actions/.github/workflows/rust-ci.yml@7906c35e00d07304674f4955f2046045693fea44
    with:
      matrix-set: full
      msrv-toolchain: "1.88"
      profiles: base,shellcheck,zsh,lua,neovim,tmux,python,openssh-netcat-lsof
      test-command: cargo test --locked && test/termnav-test
      termux-profiles: base,zsh,neovim,tmux,python,openssh-netcat-lsof
      termux-command: TERMNAV_TEST_BINARY=./termnav TERMNAV_SKIP_SHELLCHECK=1 test/termnav-test
      termux-host-command: |
        archive=$(
          CARGO_TARGET_DIR="$RUNNER_TEMP/termnav-termux-target" \
            scripts/package-release.sh "$RUST_TARGET" "$ASSET_PLATFORM"
        )
        scripts/smoke-release.sh "$ASSET_PLATFORM"
        mkdir -p .termux-ci
        tar -xzf "$archive" -C .termux-ci ./bin/termnav
        cp .termux-ci/bin/termnav ./termnav
      android-package-smoke-command: |
        scripts/package-release.sh "$RUST_TARGET" "$ASSET_PLATFORM"
        scripts/smoke-release.sh "$ASSET_PLATFORM"
      package-smoke-musl-target: x86_64-unknown-linux-musl
      package-smoke-command: |
        scripts/package-release.sh "$RUST_TARGET" linux-x86_64-musl
        scripts/smoke-release.sh linux-x86_64-musl

  actions-sync:
    name: cgraf78/actions sync
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # GitHub resolves literal `uses:` refs before a job can read repository
      # files, so `.github/cgraf78-actions.lock` cannot be interpolated. This gate
      # verifies every unavoidable cgraf78/actions literal still matches that
      # single reviewed dependency decision.
      - uses: cgraf78/actions/.github/actions/verify-consumer-sync@7906c35e00d07304674f4955f2046045693fea44

  vscode-adapter:
    name: VS Code adapter / Ubuntu
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # The broad shell matrix may omit Node in minimal containers. This
      # required host job makes the shipped extension's runtime behavior a hard
      # contract instead of accepting its documented optional skip.
      - name: Exercise the production VS Code adapter
        run: |
          node --version
          test/suites/vscode-adapter-test

  relay-performance:
    name: Relay hot path / Ubuntu
    if: ${{ github.event_name == 'pull_request' }}
    runs-on: ubuntu-24.04
    # The harness has bounded protocol waits, but it deliberately executes both
    # the PR and its base revision. A historical binary deadlock must not retain
    # a hosted runner until GitHub's much larger platform default expires.
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      # This is a standalone benchmark job, not a child of the reusable Rust
      # matrix above, so it must establish its own toolchain before the harness
      # builds both the base revision and the pull-request candidate.
      - name: Install Rust
        uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable
        with:
          toolchain: stable

      - name: Compare relay hot paths with the PR base
        env:
          TERMNAV_PERFORMANCE_BASELINE: ${{ github.event.pull_request.base.sha }}
        run: test/suites/relay-performance-test

      - name: Exercise the post-cutover baseline path
        env:
          TERMNAV_PERFORMANCE_BASELINE: HEAD
          TERMNAV_PERFORMANCE_SAMPLES: "2"
        run: test/suites/relay-performance-test

  relay-performance-macos:
    name: Relay hot path / macOS
    if: ${{ github.event_name == 'pull_request' }}
    runs-on: macos-latest
    # Keep the same outer failure contract on the slower procfs-free path.
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Install Rust
        uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable
        with:
          toolchain: stable

      - name: Install tmux
        run: brew install tmux

      # macOS has no procfs. This repeats the real nested-boundary benchmark on
      # the fallback process-inspection path so a change cannot be fast on
      # Linux while spawning enough `ps` processes to feel sluggish on Macs.
      - name: Compare relay hot paths with the PR base
        env:
          TERMNAV_PERFORMANCE_BASELINE: ${{ github.event.pull_request.base.sha }}
          TERMNAV_PERFORMANCE_SAMPLES: "20"
        run: test/suites/relay-performance-test

  eza-current:
    name: Current eza compatibility / Arch
    runs-on: ubuntu-latest
    # The job intentionally tracks Arch's rolling userland to catch current eza
    # compatibility. A digest would turn that policy into a stale snapshot.
    container: archlinux:latest # zizmor: ignore[unpinned-images]
    steps:
      - name: Install test dependencies
        run: |
          pacman-key --init
          pacman-key --populate
          pacman -Syu --noconfirm bash eza git lua python rust zsh

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Exercise current eza CLI
        shell: bash
        run: |
          cargo build --release --locked
          test/suites/wezterm-integration-test

  required:
    name: Required
    if: ${{ always() }}
    needs: [rust, vscode-adapter, eza-current, relay-performance, relay-performance-macos]
    runs-on: ubuntu-24.04
    env:
      RUST_RESULT: ${{ needs.rust.result }}
      VSCODE_ADAPTER_RESULT: ${{ needs.vscode-adapter.result }}
      EZA_CURRENT_RESULT: ${{ needs.eza-current.result }}
      RELAY_PERFORMANCE_RESULT: ${{ needs.relay-performance.result }}
      RELAY_PERFORMANCE_MACOS_RESULT: ${{ needs.relay-performance-macos.result }}
    steps:
      - name: Require all Termnav compatibility checks
        shell: bash
        run: |-
          printf 'Rust CI: %s\n' "$RUST_RESULT"
          printf 'VS Code adapter: %s\n' "$VSCODE_ADAPTER_RESULT"
          printf 'Current eza: %s\n' "$EZA_CURRENT_RESULT"
          printf 'Relay performance: %s\n' "$RELAY_PERFORMANCE_RESULT"
          printf 'Relay performance macOS: %s\n' "$RELAY_PERFORMANCE_MACOS_RESULT"

          test "$RUST_RESULT" = success
          test "$VSCODE_ADAPTER_RESULT" = success
          test "$EZA_CURRENT_RESULT" = success
          case "$RELAY_PERFORMANCE_RESULT" in
            success | skipped) ;;
            *) exit 1 ;;
          esac
          case "$RELAY_PERFORMANCE_MACOS_RESULT" in
            success | skipped) ;;
            *) exit 1 ;;
          esac
