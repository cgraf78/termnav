name: Tests

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]
  schedule:
    - cron: "0 7 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    uses: cgraf78/actions/.github/workflows/portable-shell-ci.yml@main # zizmor: ignore[unpinned-uses]
    with:
      profiles: base,lua,neovim,tmux,python,openssh-netcat-lsof
      test-command: test/termnav-test
