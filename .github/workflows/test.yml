name: Tests

on:
  push:
    branches: [master, main]
  pull_request:
  schedule:
    - cron: "0 7 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  shell:
    uses: cgraf78/actions/.github/workflows/shell-ci.yml@f9a9074b2d43fb3812067477d29307ef1e84e70e
    with:
      matrix-set: full
      profiles: base,zsh,lua,neovim,tmux,python,openssh-netcat-lsof
      shellcheck-inventory-path: .github/shellcheck-files.txt
      test-command: TERMNAV_SKIP_SHELLCHECK=1 test/termnav-test

  eza-current:
    name: Current eza compatibility / Arch
    runs-on: ubuntu-latest
    container: archlinux:latest
    steps:
      - name: Install test dependencies
        run: |
          pacman-key --init
          pacman-key --populate
          pacman -Syu --noconfirm bash eza git lua python zsh

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Exercise current eza CLI
        shell: bash
        run: test/suites/wezterm-test
